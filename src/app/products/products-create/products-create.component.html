<div class="container" 
       
>
    <div class="container-title">
        {{title}}
    </div>
    <div class="form"
        [@loading]="isLoading?'start':'end'"
    >
        <form class="form-menu" 
            [formGroup]="productDetails"
            (ngSubmit)="onSubmit()"
        >
            <div class="form-menu-item" *ngFor="let item of productBase">
                <div class="form-menu-item-label">
                    <label [for]="item.id" class="form-menu-item-label-name">
                        {{ item.placeholder }}
                    </label>
                </div>
                <div class="form-menu-item-name">
                    <input  [type]="item.type" class="form-menu-item-name-value"
                        [id]="item.id"
                        [name]="item.name"
                        [formControlName]="item.name"
                    >
                </div>
            </div>
            <div class="form-menu-submit">
                <button class="form-menu-submit-btn" type="submit" >Submit</button>
            </div>
        </form>
    </div>

    <div class="message" 
        [@error]="isError?'start':'end'" 
        [@success]="isSuccess?'start':'end'"  
    >
        <span>{{message}}</span>
    </div>
    <div class="loading-box"
    *ngIf="isLoading"
    >
    <img class="lodaing-box-img" src="../../../assets/images/loading.gif" alt="loading image">
    </div>
</div>
